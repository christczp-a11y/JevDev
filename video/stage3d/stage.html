<!-- 3D 立体书舞台（docs/画面改版-纸片马里奥风格-给云端.md，接法 A）：
     角色、道具、2D 特效（选择题、横幅、徽章……）照旧由 video/engine.html + puppet.js 画（藏在 iframe 里），
     每帧把每个角色 / 道具单独画成透明底的图，作为 CanvasTexture 贴到 3D 纸片上（纸片马力欧新作的做法：一块贴图长方形）；
     2D 特效画成一层透明图叠在最上面。
     场景：书桌上一本打开的立体书；书页上立着纸片（城墙、城门、树……）和有体积的卡纸模型；远景是一圈弯曲的背景纸（任何机位都拍不到边）。
     镜头（docs/research/纸艺作品-运镜场景叙事.md）：每一页先用书桌机位交代，再切电影镜头；讲知识点时镜头稳住；结尾拉远回到书桌。
     由 video/stage3d/build_stage3d.py 逐帧调用 renderFrame(t) 截图。 -->

<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1080, H = +q.get('h') || 1920, K = W / 1080;
const S = 1 / 100;                        // 2D 世界坐标（像素）→ 3D 单位
const SS = 2;                             // 角色 / 道具贴图放大倍数（特写不糊）
const OW = 1000 * SS, OH = 760 * SS, FOOT = 60 * SS;   // 贴图尺寸（和 engine.html 的 renderSolo 一致）
const HUD_Y = 170;                        // 计分牌（信用值、赏金）在竖屏上的位置：顶部标签下面
const BAND_Y = 470;                       // 2D 特效层（原来的闯关画面大小 1080×608）叠在竖屏上的位置
const GY = 0.35;                          // 书页上站立面的高度

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.id = 'gl'; document.body.insertBefore(renderer.domElement, document.body.firstChild);
const ui = document.getElementById('ui'); ui.width = W; ui.height = H; const U = ui.getContext('2d');

const scene = new THREE.Scene();
const ROOM = 0xe9d6b4;
scene.background = new THREE.Color(ROOM);
scene.fog = new THREE.Fog(ROOM, 60, 140);
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 300);
// 光：暖色主光从左前上方打过来。光源和影子范围固定不动（跟着镜头动会让影子每帧跳，城墙上一闪一闪）
const hemi = new THREE.HemisphereLight(0xfff4e2, 0x7a5a40, 1.35); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeccc, 2.6);
sun.position.set(-9, 20, 16); sun.target.position.set(0, 0, 0); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const easeOutBack = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (u - 1) ** 3 + c1 * (u - 1) ** 2; };
const lerp = (a, b, u) => a + (b - a) * u;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function paperTex(base, seed, size = 512) {   // 程序生成的纸纹
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, size, size);
  let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < size * size / 22; i++) {
    const v = rnd() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${0.05 * rnd()})`;
    g.fillRect(rnd() * size, rnd() * size, 1 + rnd() * 3, 1 + rnd() * 1.5);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function cardBox(w, h, d, color, seed) {   // 卡纸盒子：纸纹 + 每条棱一圈浅色纸边
  const tex = paperTex(color, seed, 256); tex.repeat.set(Math.max(1, w / 2), Math.max(1, h / 2));
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 }));
  m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0xfbf3e2 })));
  return m;
}
function roofPrism(w, h, d, color, seed) {
  const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(0, h); sh.lineTo(-w / 2, 0);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: false }); geo.translate(0, 0, -d / 2);
  const tex = paperTex(color, seed, 256); tex.repeat.set(0.3, 0.3);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })); m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xfbf3e2 })));
  return m;
}

// ---- 桌面 + 打开的立体书（书外面的东西在质检时涂成品红：故事镜头里拍到品红 = 穿帮）----
const outside = [];
const table = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: paperTex('#5e3d27', 3), roughness: 0.9 }));
table.material.map.repeat.set(20, 20); table.rotation.x = -Math.PI / 2; table.position.y = -0.7; table.receiveShadow = true; scene.add(table); outside.push(table);
const cover = cardBox(26.5, 0.5, 17.6, '#34425f', 11); cover.position.y = -0.42; scene.add(cover); outside.push(cover);
const pageMat = new THREE.MeshStandardMaterial({ map: paperTex('#f3e8cf', 7), roughness: 0.95 }); pageMat.map.repeat.set(3, 2);
for (const s of [-1, 1]) {
  const pg = new THREE.Mesh(new THREE.BoxGeometry(12.9, 0.36, 16.8), pageMat);
  pg.position.set(s * 6.46, -0.02, 0); pg.receiveShadow = true; scene.add(pg);   // 两页平放、在书脊处接上（斜着放会在书脊露出一条缝）
}

const loader = new THREE.TextureLoader();
const pops = [];                          // 翻页时弹起 / 折倒的东西：{obj, t0, kind: 'hinge' | 'group'}
const stage = new THREE.Group(); scene.add(stage);   // 这一页上的所有东西
async function loadTex(url) { const t = await loader.loadAsync(url); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function flatMesh(tex, w, h, crop = 1) {
  const geo = new THREE.PlaneGeometry(w, h); geo.translate(0, h / 2, 0);
  if (crop < 1) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * crop); }
  const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.88 });
  const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
  return mesh;
}
// 竖立的纸片：铰链在底边，翻页时从书页上弹起
async function flat(url, x, z, h, t0, ry = 0, opts = {}) {
  const tex = await loadTex(url);
  const full = h * tex.image.width / tex.image.height, w = opts.w || full;
  const mesh = flatMesh(tex, w, h, opts.w && opts.crop ? w / full : 1);
  const hinge = new THREE.Group(); hinge.position.set(x, GY + (opts.y || 0), z); hinge.rotation.y = ry; hinge.add(mesh); stage.add(hinge);
  pops.push({ obj: mesh, t0, kind: 'hinge' }); return hinge;
}
function popGroup(obj, t0) { obj.userData.s = obj.scale.y; pops.push({ obj, t0, kind: 'group' }); return obj; }

// 远景：一圈弯曲的背景纸（圆柱内壁），远山图左右循环贴三遍，上面补一段天空。任何故事镜头都拍不到它的边
async function backdrop(url, R = 14, cz = 1.5, Hh = 21, opts = {}) {
  const img = (await loadTex(url)).image, reps = 3, cw = img.width * reps, arc = Math.PI * 1.25;
  const ch = Math.round(cw * Hh / (R * arc));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d');
  const probe = document.createElement('canvas'); probe.width = img.width; probe.height = 4; const pg = probe.getContext('2d'); pg.drawImage(img, 0, 0);
  const d = pg.getImageData(0, 1, img.width, 1).data; let r = 0, gg = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  const n = d.length / 4, top = `rgb(${r / n | 0},${gg / n | 0},${b / n | 0})`;
  const grad = g.createLinearGradient(0, 0, 0, ch - img.height); grad.addColorStop(0, '#bfe0f2'); grad.addColorStop(1, top);
  g.fillStyle = grad; g.fillRect(0, 0, cw, ch - img.height + 2);
  for (let i = 0; i < reps; i++) g.drawImage(img, i * img.width, ch - img.height);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const geo = new THREE.CylinderGeometry(R, R, Hh, 96, 1, true, Math.PI - arc / 2, arc);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, side: THREE.BackSide, roughness: 1, fog: false }));
  m.position.set(0, GY + Hh / 2 - 0.2, cz); m.receiveShadow = false;
  // 背景纸脚下铺一圈草地（从书页后沿铺到背景纸）：透过城门洞、从低处看出去都不会看到书外面的桌子
  const ringTex = paperTex(opts.ground || '#93b262', 24); ringTex.repeat.set(6, 6);
  const ring = new THREE.Mesh(new THREE.RingGeometry(8.6, R + 0.05, 96, 1, 0, Math.PI * 2), new THREE.MeshStandardMaterial({ map: ringTex, roughness: 1 }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(0, 0.12, cz); ring.receiveShadow = true;
  const hinge = new THREE.Group(); hinge.add(m); hinge.add(ring); stage.add(hinge); popGroup(hinge, 0.02);
  return m;
}

// 故事镜头里，地面往书页前面和两边再延伸一大片（同色），拉远构图时画面底部不会拍到书外面；
// 书桌机位、结尾拉远时把它藏起来，才看得到「原来是书桌上的一本书」
const aprons = [];
function apron(color) {
  const tex = paperTex(color, 61); tex.repeat.set(12, 12);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, 0.2, 0); m.receiveShadow = true; stage.add(m); aprons.push(m);
}
// ---- 场景 ----
const SETS = {
  async qin_gate(o) {
    const A = '../assets/sets/qin_gate/';
    await backdrop(A + 'far.png');
    const grass = cardBox(25.6, 0.12, 16.6, '#9dbb6a', 21); grass.position.set(0, 0.22, 0); stage.add(grass);   // 铺满整页
    apron('#9dbb6a');
    const road = cardBox(25.4, 0.1, 2.6, '#d9b98a', 22); road.position.set(0, 0.3, 1.9); stage.add(road);
    const gx = o.gateX ?? 5.2, gz = -5.4, gh = 5.4, gw = gh * 780 / 547;
    const path = cardBox(1.9, 0.1, 6.4, '#d9b98a', 23); path.position.set(gx, 0.3, -2.2); stage.add(path);   // 从大路通到城门，穿过门洞往外
    await flat(A + 'gate.png', gx, gz, gh, 0.35);
    // 城墙只砌在城门两边：门洞后面不能有墙（不然门被堵死）
    const wh = 2.4, ww = wh * 1542 / 242, left = gx - gw / 2 + 0.15, right = gx + gw / 2 - 0.15;
    await flat(A + 'wall.png', left - (left + 12.8) / 2, gz - 0.05, wh, 0.2, 0, { w: left + 12.8, crop: true });
    if (right < 12.8) await flat(A + 'wall.png', right + (12.8 - right) / 2, gz - 0.05, wh, 0.25, 0, { w: 12.8 - right, crop: true });
    await Promise.all([
      flat(A + 'pine.png', -11.3, -2.6, 6.2, 0.45, 0.35), flat(A + 'pine.png', 11.4, -2.0, 5.4, 0.5, -0.35),
      flat(A + 'flag.png', gx - gw / 2 - 1.2, gz + 0.6, 3.8, 0.55), flat(A + 'flag.png', gx + gw / 2 + 0.8, gz + 0.6, 3.8, 0.6),
      flat(A + 'stall.png', -9.2, -1.4, 2.8, 0.7, 0.3), flat(A + 'bush.png', 10.4, 3.4, 1.2, 0.8, -0.2), flat(A + 'rock.png', -10.6, 3.4, 0.9, 0.85, 0.2),
    ]);
    const house = new THREE.Group(); const hb = cardBox(3.2, 2.2, 2.4, '#e6cfa4', 31); hb.position.y = 1.1; house.add(hb);
    const rf = roofPrism(3.8, 1.3, 2.8, '#8f4a3a', 32); rf.position.y = 2.2; house.add(rf);
    const door = cardBox(0.8, 1.3, 0.05, '#6b4630', 33); door.position.set(0.5, 0.65, 1.22); house.add(door);
    house.position.set(-5.4, GY, -3.7); house.rotation.y = 0.15; stage.add(house); popGroup(house, 0.3);
    const crates = new THREE.Group();
    [[0, 0.45, 0], [0.95, 0.45, 0.1], [0.45, 1.3, 0.05]].forEach(([x, y, z], i) => { const b = cardBox(0.9, 0.9, 0.9, '#b98a55', 40 + i); b.position.set(x, y, z); crates.add(b); });
    crates.position.set(-8.4, GY, 0.2); stage.add(crates); popGroup(crates, 0.75);
  },
  async classroom(o) {
    const A = '../assets/sets/classroom/';
    const floor = cardBox(25.4, 0.12, 16, '#c9965e', 51); floor.position.set(0, 0.22, 0); stage.add(floor);
    apron('#c9965e');
    await flat(A + 'far.png', 0, -4.2, 9.5, 0.05, 0, {});   // 教室后墙（黑板、窗户）
    const upper = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshStandardMaterial({ map: paperTex('#e8dcc4', 52), roughness: 1 }));
    upper.position.set(0, GY + 9.3 + 15, -4.25); stage.add(upper);   // 后墙往上接一段（拉远时不会拍到墙顶外面）
    const side = await loadTex(A + 'far.png');
    for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(9, 9.5), new THREE.MeshStandardMaterial({ color: 0xe8dcc4, roughness: 1 }));
      m.scale.x = 4; m.position.set(s * 8.4, GY + 4.75, 14); m.rotation.y = -s * Math.PI / 2; m.receiveShadow = true; stage.add(m); }
  },
};

// ---- 角色、道具：engine 画好的透明图 → 3D 纸片 ----
const actors = {}, props = [];
function texPlane(z) {
  const c = document.createElement('canvas'); c.width = OW; c.height = OH;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const geo = new THREE.PlaneGeometry(OW * S / SS, OH * S / SS); geo.translate(0, (OH / 2 - FOOT) * S / SS, 0);   // 脚底在原点
  const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.85 });
  const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true;
  mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.45 });
  mesh.position.z = z; stage.add(mesh);
  return { mesh, canvas: c, tex, z, x: 0, h: 2.5 };
}
let pole, poleLie, POLE;
function makePole(p, z) {
  const H = p.height * S, r = p.thick * S * 0.55;
  const mat = new THREE.MeshStandardMaterial({ map: paperTex('#9a6a3c', 5, 256), roughness: 0.8 });
  const mk = () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.08, H, 20), mat); m.castShadow = m.receiveShadow = true; return m; };
  pole = mk(); pole.userData = { x: (p.x - X0) * S, z, H }; stage.add(pole);
  poleLie = mk(); poleLie.rotation.z = Math.PI / 2; poleLie.visible = false; stage.add(poleLie);
}

let ENG, SC, X0 = 1100, SHOTS = [], SUBS = [], DUR = 0, FLIP = [true, true], overlayC, hudC;
window.stageInit = async (sceneData, assets, opts) => {
  // 2D 里「从画面下沿冒出来」的围观群众（enter: 'rise' + y 下沉），在 3D 里改成直接站在地上，不然会半截埋进土里
  for (const a of Object.values(sceneData.actors)) if (a.enter === 'rise') { a.enter = 'pop'; a.y = 0; }
  SC = sceneData; SHOTS = opts.shots; SUBS = sceneData.subtitles; X0 = opts.x0 ?? 1100; DUR = sceneData.duration; FLIP = opts.flip || [true, true];
  ENG = document.getElementById('engine').contentWindow;
  await ENG.init(sceneData, assets);
  await SETS[opts.set || sceneData.set.name || 'qin_gate'](opts);
  const Z = opts.z || {};
  for (const id of Object.keys(SC.actors)) actors[id] = texPlane(Z[id] ?? 1.0);
  SC.props.forEach((p, i) => {
    if (p.type === 'pole') { POLE = p; makePole(p, Z[p.by] ?? 1.0); return; }
    if (p.type === 'sprite' && p.layer === 'overlay') return;   // 画在 2D 特效层
    if (p.type !== 'sprite' && p.type !== 'board') return;
    const z = (p.z3 ?? (p.layer === 'mid' ? -5.6 : p.layer === 'front' ? 2.7 : p.type === 'board' ? -0.6 : (Z['prop:' + p.img] ?? -0.3))) + 0.02 * i;   // 同一张图的两个道具（比如空书和写了字的书）错开一点，不然互相闪
    props.push({ i, ...texPlane(z) });
  });
  overlayC = document.createElement('canvas'); overlayC.width = 1080; overlayC.height = 608;
  hudC = document.createElement('canvas'); hudC.width = 1080; hudC.height = 100;
  await document.fonts.load('700 58px "Noto Sans SC"'); await document.fonts.load('40px "ZCOOL KuaiLe"');
  return true;
};
window.qaLeak = on => {   // 质检：书外面的东西和房间背景涂成品红
  scene.background = new THREE.Color(on ? 0xff00ff : ROOM); scene.fog.color.set(on ? 0xff00ff : ROOM);
  for (const m of outside) { m.material.emissive = new THREE.Color(on ? 0xff00ff : 0); m.material.map = on ? null : m.material.map; m.material.color.set(on ? 0x000000 : 0xffffff); m.material.needsUpdate = true; }
};

// ---- 镜头类型：参数化，可以跟着角色走 ----
function A_(id) { const a = actors[id]; return { x: (a.x - X0) * S, z: a.z, h: a.h }; }
const CAMS = {
  // 书桌机位：斜上方看整页（交代谁在哪）
  desk: (u, p) => ({ pos: V3((p.x ?? 0) * 0.6 + lerp(-0.6, 0.6, u), lerp(12.5, 11.5, u), lerp(17.5, 16.5, u)), look: V3((p.x ?? 0) * 0.8, 1.2, -0.8), fov: 42 }),
  // 稳定中景：讲事情、选择题、知识点时用（几乎不动）
  wide: (u, p) => ({ pos: V3(p.x + lerp(-0.15, 0.15, u), p.y ?? 3.0, p.d ?? 11.5), look: V3(p.x, p.ly ?? 1.6, 0.6), fov: p.fov ?? 40 }),
  // 贴地仰拍：高度、威严
  low: (u, p) => ({ pos: V3(p.x, 0.6, (p.d ?? 6.4) - 0.5 * u), look: V3(p.tx, p.ty, p.tz ?? 1.2), fov: p.fov ?? 50 }),
  // 斜上方高机位：人群、全局
  high: (u, p) => ({ pos: V3(p.x + lerp(3.0, 2.4, u), lerp(5.6, 5.0, u), lerp(9.4, 8.6, u)), look: V3(p.x, 1.0, 1.2), fov: 40 }),
  // 特写：跟着角色（反应镜头）
  close: (u, p) => { const a = A_(p.id), d = p.d ?? a.h * 1.6 + 0.9; return { pos: V3(a.x + (p.dx ?? -0.5), a.h * 0.62 + 0.3, a.z + d - 0.3 * u), look: V3(a.x, a.h * 0.55 + 0.25, a.z), fov: 36 }; },
  // 跟拍：在角色斜前方跟着走
  follow: (u, p) => { const a = A_(p.id); return { pos: V3(a.x + (p.dx ?? 3.2), 2.6, a.z + (p.d ?? 8.0)), look: V3(a.x + 0.8, 1.6, a.z), fov: 42 }; },
  // 推近

// ---- 自动构图（Chris 2026-09-29：人物跑出画面）：镜头要拍到谁，就按这些人（道具）实际不透明部分的大小算距离，
// 保证他们整个人落在「顶部计分牌以下、字幕以上」的安全区里。手写坐标的镜头换了角色、改了站位就会拍歪，这个不会。
const SAFE = { top: 270, bottom: 1440, side: 0.07 };   // 安全区（竖屏像素）；左右各留 7%
const scratch = document.createElement('canvas'); scratch.width = OW; scratch.height = OH;

const fitCache = {};

CAMS.fit = (u, p, sh, t) => {

  const elev = { low: -0.18, eye: 0.12, high: 0.62 }[p.elev || 'eye'], az = (p.az ?? 0) * Math.PI / 180;
  const w = B.x1 - B.x0, h = B.y1 - B.y0, cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2;

window.camFor = t => { const sh = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1]; return sh; };

function drawUI(t) {
  U.clearRect(0, 0, W, H);
  U.save(); U.scale(K, K);
  ENG.renderOverlay(t, overlayC); U.drawImage(overlayC, 0, BAND_Y);   // 2D 特效层（选择题、横幅、徽章……）
  ENG.renderHudLayer(t, hudC); U.drawImage(hudC, 0, HUD_Y);          // 计分牌：顶部，系列标签下面
  U.font = '40px "ZCOOL KuaiLe"'; const kw = U.measureText(SC.title.kicker).width + 60;
  U.fillStyle = 'rgba(42,35,32,0.88)'; roundRect(U, (1080 - kw) / 2, 90, kw, 66, 33); U.fill();
  U.fillStyle = '#f4e8d0'; U.textAlign = 'center'; U.textBaseline = 'middle'; U.fillText(SC.title.kicker, 540, 124);
  const sub = SUBS.find(s => t >= s[0] && t <= s[1]);
  if (sub) {
    const [t0, t1, who, text] = sub, a = Math.min(1, (t - t0) / 0.15, (t1 - t) / 0.15);
    U.globalAlpha = a; U.font = '700 58px "Noto Sans SC"';
    const lines = wrap(U, text, 880), bh = 40 + lines.length * 76, y0 = 1600 - bh / 2;
    U.fillStyle = 'rgba(251,243,226,0.95)'; roundRect(U, 70, y0, 940, bh, 22); U.fill();
    U.strokeStyle = '#fffaf0'; U.lineWidth = 5; U.stroke();
    U.fillStyle = '#2a2320'; lines.forEach((ln, i) => U.fillText(ln, 540, y0 + 20 + 76 * (i + 0.5)));
    if (who) { U.font = '40px "ZCOOL KuaiLe"'; const ww = U.measureText(who).width + 44;
      U.fillStyle = who === '旁白' ? '#7d6b5a' : '#c8372d'; roundRect(U, 540 - ww / 2, y0 - 50, ww, 58, 29); U.fill();
      U.fillStyle = '#fffaf0'; U.fillText(who, 540, y0 - 20); }

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, text, maxW) {   // 两行时在标点后面断

  const P = '，。？！：；、…—', ch = [...text]; let best = -1, bd = 1e9;
  for (let i = 1; i < ch.length - 1; i++) if (P.includes(ch[i - 1]) && !P.includes(ch[i])) {
    const a = ch.slice(0, i).join(''), b = ch.slice(i).join(''); if (g.measureText(a).width <= maxW && g.measureText(b).width <= maxW && Math.abs(a.length - b.length) < bd) { best = i; bd = Math.abs(a.length - b.length); } }
  if (best > 0) return [ch.slice(0, best).join(''), ch.slice(best).join('')];

window.frameBoxes = () => {   // 入画质检：每个看得见的角色，不透明部分投到屏幕上的框（像素，竖屏 1080×1920 坐标）
  const out = [];
  for (const [id, a] of Object.entries(actors)) {
    if (!a.mesh.visible) continue;
    const d = a.canvas.getContext('2d').getImageData(0, 0, OW, OH).data; let x0 = OW, x1 = -1, y0 = OH, y1 = -1;
    for (let y = 0; y < OH; y += 4) for (let x = 0; x < OW; x += 4) if (d[(y * OW + x) * 4 + 3] > 128) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) continue;
    const pts = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([px, py]) => {
      const v = new THREE.Vector3((px - OW / 2) * S / SS, (OH - FOOT - py) * S / SS * a.mesh.scale.y, 0).add(a.mesh.position).project(cam);
      return [(v.x + 1) / 2 * 1080, (1 - v.y) / 2 * 1920, v.z]; });
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    out.push({ id, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), behind: pts.some(p => p[2] > 1) });
  }

};
window.visibleFraction = id => {   // 遮挡质检：这个角色有多少像素没被前面的东西挡住（先整帧画一次数品红，再只画他一个人数一次）
  const a = actors[id]; if (!a || !a.mesh.visible) return 1;
  const gl = renderer.getContext(), count = () => { const px = new Uint8Array(1080 * 1920 * 4 * K * K | 0);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px); let n = 0; for (let i = 0; i < px.length; i += 16) if (px[i] > 200 && px[i + 1] < 60 && px[i + 2] > 200) n++; return n; };
  const mat = a.mesh.material, magenta = new THREE.MeshBasicMaterial({ color: 0xff00ff, map: mat.map, alphaTest: 0.45, side: THREE.DoubleSide });

window.renderFrame = (t, opts = {}) => {

    if (p.kind === 'hinge') p.obj.rotation.x = -Math.PI / 2 * (1 - up); else p.obj.scale.y = Math.max(0.001, up) * (p.obj.userData.s || 1);

    a.x = r.x; if (r.top != null) a.h = (500 - r.top) * S; a.tex.needsUpdate = true;

    const r = ENG.renderSoloProp(p.i, t, p.canvas, SS);

    const H = POLE.height * S, ap = POLE.appear ?? -1e9, rise = (1 - easeOutBack(clamp((t - ap) / 0.45))) * H;

window.ready = true;
