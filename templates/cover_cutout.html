<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 抠图封面：亮色底（赛道数据：画面偏暗和互动负相关）+ 大字标题 + 抠出来的实物照片 */
  :root { --bg: $bg; --ink: #1d1a17; --accent: $accent; --muted: rgba(29, 26, 23, .7); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1440px; background: var(--bg); color: var(--ink);
         font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  .page { position: relative; width: 100%; height: 100%; padding: 88px 80px 72px; display: flex; flex-direction: column; }
  .kicker { display: inline-block; align-self: flex-start; background: var(--ink); color: var(--bg);
            font-size: 38px; font-weight: 700; padding: 10px 26px; border-radius: 999px; letter-spacing: 2px; }
  h1 { margin-top: 36px; font-size: 112px; line-height: 1.1; font-weight: 900; letter-spacing: -2px;
       text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 24px; font-size: 42px; line-height: 1.4; color: var(--muted); text-wrap: pretty; }
  .food { position: relative; flex: 1; min-height: 0; margin: 24px -40px 0; display: flex; align-items: center; justify-content: center; }
  .food::before { content: ""; position: absolute; width: 860px; height: 860px; border-radius: 50%;
                  background: radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 68%); }
  .food img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain;
              filter: drop-shadow(0 28px 36px rgba(60, 30, 0, .28)); }
  .badge { position: absolute; right: 40px; bottom: 8px; background: rgba(29, 26, 23, .62); color: #fff;
           font-size: 26px; padding: 8px 20px; border-radius: 999px; letter-spacing: 1px; }
  .foot { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
          font-size: 30px; color: var(--muted); }
  .foot .tag { font-weight: 700; color: var(--ink); }
  .foot .src { white-space: nowrap; }
</style>
</head>
<body>
<div class="page">
  <span class="kicker">$kicker</span>
  <h1>$title_html</h1>
  <p class="sub">$subtitle</p>
  <div class="food"><img src="data:image/png;base64,$cutout_b64"><span class="badge">$label</span></div>
  <div class="foot"><span class="tag">$footer_left</span><span class="src">AI 辅助整理 · 数据来自公开评价</span></div>
</div>
</body>
</html>
