<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: $bg; --ink: #1d1a17; --accent: $accent; --muted: #6b6259; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1440px; background: var(--bg); color: var(--ink);
         font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  .page { position: relative; width: 100%; height: 100%; padding: 96px 88px 80px; display: flex; flex-direction: column; }
  .kicker { display: inline-block; align-self: flex-start; background: var(--ink); color: var(--bg);
            font-size: 38px; font-weight: 700; padding: 10px 26px; border-radius: 999px; letter-spacing: 2px; }
  h1 { margin-top: 48px; font-size: 118px; line-height: 1.12; font-weight: 900; letter-spacing: -2px; text-wrap: balance; }
  .sub { text-wrap: pretty; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 36px; font-size: 44px; line-height: 1.5; color: var(--muted); font-weight: 400; }
  .items { margin-top: 56px; display: flex; flex-direction: column; gap: 26px; }
  .item { display: flex; align-items: baseline; gap: 28px; background: rgba(255,255,255,.6);
          border-radius: 28px; padding: 26px 34px; }
  .item .no { font-size: 58px; font-weight: 900; color: var(--accent); min-width: 64px; }
  .item .name { font-size: 46px; font-weight: 700; }
  .item .meta { font-size: 34px; color: var(--muted); margin-top: 6px; }
  .foot { margin-top: auto; padding-top: 32px; display: flex; justify-content: space-between; align-items: flex-end;
          font-size: 30px; color: var(--muted); }
  .foot .tag { font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
<div class="page">
  <span class="kicker">$kicker</span>
  <h1>$title_html</h1>
  <p class="sub">$subtitle</p>
  <div class="items">$items_html</div>
  <div class="foot"><span class="tag">$footer_left</span><span>AI 辅助整理 · 数据来自公开评价</span></div>
</div>
</body>
</html>
